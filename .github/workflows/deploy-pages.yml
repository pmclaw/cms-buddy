name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /cms-buddy/

      # 单页应用：深链接交给 404.html 兜底，交给前端路由处理
      # 站点根 404.html 是唯一生效的 404 页：主站深链接沿用主站 index.html 原样恢复；
      # admin 深链接由注入脚本分发（写 sessionStorage 后跳 /cms-buddy/admin/，admin 启动时精确恢复路由）
      - name: Prepare SPA fallback
        run: |
          cp dist/index.html dist/404.html && touch dist/.nojekyll
          node admin/scripts/inject-admin-404.mjs dist/404.html

      # 移动端是独立的 Vite 工程（app/），产物发布到同一站点的 /app/ 子目录
      - name: Build mobile app
        working-directory: app
        run: npm ci && npm run build
        env:
          BASE_PATH: /cms-buddy/app/

      - name: Merge mobile app into dist
        run: mkdir -p dist/app && cp -R app/dist/. dist/app/

      # PC 后台管理是独立的 Vite 工程（admin/），产物发布到同一站点的 /admin/ 子目录
      - name: Build admin console
        working-directory: admin
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
        env:
          BASE_PATH: /cms-buddy/admin/

      - name: Merge admin console into dist
        run: mkdir -p dist/admin && cp -R admin/dist/. dist/admin/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
